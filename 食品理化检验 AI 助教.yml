    opening_statement: '你好！我是《食品理化检验》课程 AI 助教演示版。

      我可以根据已上传的模拟课程资料，回答学习安排、作业要求、答疑时间和课前准备等问题，并提供资料引用。资料没有说明的内容，我会明确告知。

      你可以试着问：

      • 单元作业什么时候交？文件有什么要求？

      • 老师每周什么时候答疑，在哪里？

      • 实验课前需要完成哪些学习准备？

      本应用使用模拟资料，仅供功能演示，不代表真实课程规定。'
